# Docker Compose for test database only.
# Usage:
#   docker compose -f docker-compose.test.yml up -d   # start
#   docker compose -f docker-compose.test.yml down -v  # stop & remove volumes

services:
  test-db:
    image: postgres:16-alpine
    container_name: lms_test_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: lms_db_test
    ports:
      - '5433:5432'
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d lms_db_test']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  test_pg_data:
